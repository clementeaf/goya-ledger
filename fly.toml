app = "goya-node"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  STORAGE_BACKEND = "rocksdb"
  STORAGE_PATH = "/data/blocks"
  ACL_MODE = "permissive"
  LOG_FORMAT = "json"
  RUST_LOG = "info"
  API_PORT = "8080"
  BIND_ADDR = "0.0.0.0"
  RATE_LIMIT_RPS = "50"
  RATE_LIMIT_RPM = "500"
  RATE_LIMIT_RPH = "10000"

[mounts]
  source = "goya_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
