<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOYA-ledger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>GOYA-ledger</h1>
    <div id="status-bar">
      <span id="status-dot" class="dot offline"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </header>

  <main>
    <!-- Identity -->
    <section class="card" id="identity-section">
      <h2>Identidad DID</h2>
      <div class="input-row">
        <input type="password" id="identity-password" placeholder="Password para cifrar clave">
        <button id="btn-create-id">Crear Identidad</button>
      </div>
      <div id="identity-list" class="result-area"></div>
    </section>

    <!-- Notarize -->
    <section class="card" id="notarize-section">
      <h2>Notarizar Documento</h2>
      <div class="input-row" style="margin-bottom: 12px">
        <select id="notarize-did">
          <option value="">Selecciona identidad...</option>
        </select>
        <input type="password" id="notarize-password" placeholder="Password">
      </div>
      <div class="drop-zone" id="drop-zone">
        <p>Arrastra un archivo aqui o haz click</p>
        <input type="file" id="file-input" hidden>
      </div>
      <div id="notarize-result" class="result-area"></div>
    </section>

    <!-- Verify -->
    <section class="card" id="verify-section">
      <h2>Verificar Hash</h2>
      <div class="input-row">
        <input type="text" id="verify-hash" placeholder="SHA-256 hash">
        <button id="btn-verify">Verificar</button>
      </div>
      <div id="verify-result" class="result-area"></div>
    </section>

    <!-- Wallet -->
    <section class="card" id="wallet-section">
      <h2>Wallet</h2>
      <div class="input-row" style="margin-bottom: 12px">
        <select id="wallet-did">
          <option value="">Selecciona identidad...</option>
        </select>
        <button id="btn-refresh-balance">Consultar</button>
        <button id="btn-faucet" class="btn-secondary">Faucet (1000)</button>
      </div>
      <div id="wallet-balance" class="result-area"></div>
    </section>

    <!-- Transfer -->
    <section class="card" id="transfer-section">
      <h2>Transferir</h2>
      <div class="input-row" style="margin-bottom: 8px">
        <select id="transfer-from">
          <option value="">Desde...</option>
        </select>
        <input type="text" id="transfer-to" placeholder="DID destino">
      </div>
      <div class="input-row">
        <input type="number" id="transfer-amount" placeholder="Cantidad" min="1">
        <input type="password" id="transfer-password" placeholder="Password">
        <button id="btn-transfer">Enviar</button>
      </div>
      <div id="transfer-result" class="result-area"></div>
    </section>

    <!-- Transaction History -->
    <section class="card" id="history-section">
      <h2>Historial</h2>
      <div class="input-row" style="margin-bottom: 12px">
        <select id="history-did">
          <option value="">Selecciona identidad...</option>
        </select>
        <button id="btn-history">Ver</button>
      </div>
      <div id="tx-history" class="result-area"></div>
    </section>

    <!-- Node Status -->
    <section class="card" id="status-section">
      <h2>Estado del Nodo</h2>
      <div id="node-status" class="result-area">
        <p>Cargando...</p>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
