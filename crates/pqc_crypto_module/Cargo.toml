[package]
name = "pqc_crypto_module"
version = "0.1.0"
edition = "2021"
description = "FIPS-oriented post-quantum cryptographic module for Cerulean Ledger DLT"
license = "MIT"

[dependencies]
pqcrypto-mldsa = "0.1.2"
pqcrypto-mlkem = "0.1.1"
pqcrypto-sphincsplus = "0.7"
pqcrypto-internals = "0.2"
pqcrypto-traits = "0.3"
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.7", features = ["derive"] }
aes-gcm = "0.10"
thiserror = "1.0"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }

[build-dependencies]
cc = "1.0"

[features]
default = []
approved-only = []

[dev-dependencies]
tempfile = "3.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ml-dsa = "0.1"
