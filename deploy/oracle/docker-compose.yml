version: "3.8"

services:
  goya-node:
    build:
      context: ../..
      dockerfile: Dockerfile.fly
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - goya_data:/data
    environment:
      STORAGE_BACKEND: rocksdb
      STORAGE_PATH: /data/blocks
      ACL_MODE: permissive
      LOG_FORMAT: json
      RUST_LOG: info
      API_PORT: "8080"
      P2P_PORT: "8081"
      BIND_ADDR: 0.0.0.0
      NETWORK_ID: goya-testnet
      RATE_LIMIT_RPS: "50"
      RATE_LIMIT_RPM: "500"
      RATE_LIMIT_RPH: "10000"
      AUTO_DISCOVERY_INTERVAL: "60"
      # Set after all nodes are deployed:
      # BOOTSTRAP_NODES: "goya-node.fly.dev:8081,<railway-host>:8081,<render-host>:8081"
    restart: unless-stopped

volumes:
  goya_data:
