name: Release Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without publishing release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ""

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            os: macos-latest
            label: macOS (Apple Silicon)
          - target: macos-x86_64
            os: macos-13
            label: macOS (Intel)
          - target: windows-x86_64
            os: windows-latest
            label: Windows (x64)

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-20

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Windows: install WebView2 build deps
      - name: Install WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WebView2 is pre-installed on windows-latest runners.
          # This step is a no-op safety net.
          if (-not (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BEB-E15AB5B37D87}' -ErrorAction SilentlyContinue)) {
            Write-Host "WebView2 not found, installing..."
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent /install' -Wait
          } else {
            Write-Host "WebView2 already installed"
          }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app
        working-directory: tauri-app
        run: cargo tauri build
        env:
          # Skip code signing for now (unsigned builds)
          TAURI_SIGNING_PRIVATE_KEY: ""

      # Collect artifacts per platform
      # Tauri may output to workspace root target/ or tauri-app/target/ depending on config.
      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          find . -path '*/release/bundle/dmg/*.dmg' -exec cp {} dist/ \;
          ls -la dist/

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem -Recurse -Path . -Include "*.exe" -Filter "*GOYA*" | Where-Object { $_.FullName -match 'release.bundle.nsis' } | Copy-Item -Destination "dist\"
          Get-ChildItem -Recurse -Path . -Include "*.msi" -Filter "*GOYA*" | Where-Object { $_.FullName -match 'release.bundle.msi' } | Copy-Item -Destination "dist\"
          Get-ChildItem dist\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
