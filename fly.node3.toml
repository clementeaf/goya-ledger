app = "goya-node-3"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  STORAGE_BACKEND = "rocksdb"
  STORAGE_PATH = "/data/blocks"
  ACL_MODE = "permissive"
  LOG_FORMAT = "json"
  RUST_LOG = "info"
  API_PORT = "8080"
  P2P_PORT = "8081"
  BIND_ADDR = "0.0.0.0"
  NETWORK_ID = "goya-testnet"
  RATE_LIMIT_RPS = "50"
  RATE_LIMIT_RPM = "500"
  RATE_LIMIT_RPH = "10000"
  AUTO_DISCOVERY_INTERVAL = "60"

[mounts]
  source = "goya_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 8081
  protocol = "tcp"
  [[services.ports]]
    port = 8081

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
